[project]
name = "donalddl_pwrd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "t.j.neep@bham.ac.uk" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
marimo = [
    "aiohttp>=3.13.3",
    "cartopy>=0.25.0",
    "donalddl-pwrd",
    "geopandas>=1.1.2",
    "marimo>=0.20.4",
    "matplotlib>=3.10.8",
    "pandas>=3.0.1",
    "xarray[complete]>=2026.2.0",
    "xvec>=0.5.2",
]

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv.sources]
donalddl-pwrd = { workspace = true, editable = true }
