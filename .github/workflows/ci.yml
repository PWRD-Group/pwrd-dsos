name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:debian-slim

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: uv sync --dev

      - name: Run pytest with coverage
        run: uv run pytest --cov=src --cov-report=xml --cov-report=term tests

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  check-notebooks:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:debian-slim

    steps:
      - uses: actions/checkout@v4

      - name: Install marimo deps
        run: uv sync --group marimo

      - name: Check notebooks
        run: uv run marimo check notebooks

  ty:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:debian-slim

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: uv sync

      - name: Run ty
        run: uvx ty check src

  ruff-check:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:debian-slim

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: uv sync

      - name: Ruff check
        run: uvx ruff check src

  ruff-format:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:debian-slim

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: uv sync

      - name: Ruff format (diff)
        run: uvx ruff format --diff src
