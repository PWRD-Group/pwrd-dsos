name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:debian-slim

    steps:
      - uses: actions/checkout@v7

      - name: Install deps
        run: uv sync --dev

      - name: Run pytest with coverage
        run: uv run pytest --cov=src --cov-report=xml --cov-report=term tests

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Upload coverage report
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage.xml
          language: Python
          label: code-coverage/pytest

  check-notebooks:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:debian-slim

    steps:
      - uses: actions/checkout@v7

      - name: Install marimo deps
        run: uv sync --group marimo

      - name: Check notebooks
        run: uv run marimo check notebooks

  ty:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:debian-slim

    steps:
      - uses: actions/checkout@v7

      - name: Install deps
        run: uv sync

      - name: Run ty
        run: uvx ty check src

  ruff-check:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:debian-slim

    steps:
      - uses: actions/checkout@v7

      - name: Install deps
        run: uv sync

      - name: Ruff check
        run: uvx ruff check src

  ruff-format:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:debian-slim

    steps:
      - uses: actions/checkout@v7

      - name: Install deps
        run: uv sync

      - name: Ruff format (diff)
        run: uvx ruff format --diff src
